# =============================================================================
# n8n Docker Compose — Main + Worker
# =============================================================================
# Chạy n8n production với 2 chế độ:
#   - main:   Server chính (UI + API + webhook receiver)
#   - worker: Worker xử lý workflow executions qua queue
#
# Prerequisites:
#   1. Build cache image:
#      ./docker/images/n8n-build-cache/build-cache.sh
#
#   2. Build production image:
#      Xem hướng dẫn trong README.md hoặc chạy:
#      docker compose -f docker/images/n8n-custom/docker-compose.yml build
#
# Usage:
#   # Start tất cả services
#   docker compose -f docker/images/n8n-custom/docker-compose.yml up -d
#
#   # Chỉ start main server
#   docker compose -f docker/images/n8n-custom/docker-compose.yml up -d n8n-main
#
#   # Scale workers
#   docker compose -f docker/images/n8n-custom/docker-compose.yml up -d --scale n8n-worker=3
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Redis (Queue backend for worker mode)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # n8n Main Server
  # ===========================================================================
  # Handles: UI, REST API, webhook listening, workflow triggering
  # In queue mode, delegates execution to workers
  # ===========================================================================
  n8n-main:
    image: ${N8N_IMAGE:-n8n-custom:latest}
    restart: unless-stopped
    ports:
      - '${N8N_PORT:-5678}:5678'
    environment:
      # --- Database ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-n8n_password}

      # --- Queue Mode (required for worker architecture) ---
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379

      # --- General ---
      N8N_HOST: ${N8N_HOST:-0.0.0.0}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Ho_Chi_Minh}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}

      # --- Encryption ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-to-a-random-string}

      # --- Optional ---
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_METRICS: ${N8N_METRICS:-true}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      NODE_ENV: production
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Main server — no extra args needed
    command: []

  # ===========================================================================
  # n8n Worker
  # ===========================================================================
  # Processes workflow executions from the queue
  # Can be scaled horizontally: --scale n8n-worker=N
  # ===========================================================================
  n8n-worker:
    image: ${N8N_IMAGE:-n8n-custom:latest}
    restart: unless-stopped
    environment:
      # --- Database (same as main) ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-n8n_password}

      # --- Queue Mode ---
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379

      # --- Worker-specific ---
      QUEUE_WORKER_TIMEOUT: ${QUEUE_WORKER_TIMEOUT:-60}
      QUEUE_WORKER_STALLED_INTERVAL: ${QUEUE_WORKER_STALLED_INTERVAL:-30000}

      # --- General ---
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Ho_Chi_Minh}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}

      # --- Encryption (MUST match main server) ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-to-a-random-string}

      # --- Optional ---
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      NODE_ENV: production
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Worker mode — pass "worker" argument to n8n
    command: ['worker']

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local
